name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"     # ~nightly; GitHub may delay scheduled runs slightly
  workflow_dispatch:          # deliberately no `push` trigger — this job commits,
                               # and a push trigger would re-run it on its own commit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: commit if changed
        run: |
          FILES="stats-dark.svg stats-light.svg streak-dark.svg streak-light.svg langs-dark.svg langs-light.svg year-dark.svg year-light.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no change, skipping commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: nightly refresh"
          git push
